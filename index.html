<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Automation System</title>

<style>
:root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --border: #d1d5db;
    --border-soft: #e2e8f0;
    --text: #1f2937;
    --text-muted: #6b7280;
    --text-label: #334155;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #15803d;
    --error: #b91c1c;
}

* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------- Main app (the only thing in the page flow) ---------- */

.app {
    background: var(--surface);
    padding: 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.app h1 {
    font-size: 1.5rem;
    text-align: center;
    margin: 0 0 8px;
}

.app .intro {
    text-align: center;
    color: var(--text-muted);
    margin: 0 0 12px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 15px;
}

textarea { height: 130px; resize: vertical; }

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--border-soft); color: var(--text-label); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.feedback {
    min-height: 1.25em;
    margin: 15px 0 0;
    font-size: 14px;
    text-align: center;
    color: var(--text-muted);
}
.feedback[data-state="ok"] { color: var(--ok); }
.feedback[data-state="error"] { color: var(--error); }

/* ---------- Developer tools (out of flow: fixed button + modal dialog) ---------- */

.dev-toggle {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #64748b;
    font-size: 21px;
    cursor: pointer;
}
.dev-toggle:hover { color: var(--accent); background: var(--border-soft); }

.dev-dialog {
    width: min(92vw, 420px);
    padding: 20px;
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    background: var(--surface-alt);
    color: var(--text);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}
.dev-dialog::backdrop { background: rgba(15, 23, 42, 0.4); }

.dev-dialog h2 { margin: 0 0 14px; font-size: 1.1rem; }
.dev-dialog label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: var(--text-label);
}
.dev-dialog .btn { margin-top: 8px; padding: 10px; font-size: 15px; }
.url-row { display: flex; gap: 8px; align-items: center; }
.url-row input { margin: 10px 0; flex: 1; min-width: 0; }
.url-row .btn { width: auto; margin: 0; padding: 12px 14px; font-size: 14px; }
.dev-status {
    font-size: 12px;
    overflow-wrap: anywhere;
    color: var(--text-muted);
    margin: 10px 0 0;
}
.dev-status[data-state="ok"] { color: var(--ok); }
.dev-status[data-state="error"] { color: var(--error); }
</style>
</head>

<body>

<!-- Main application -->
<main class="app">
    <h1>Email Automation</h1>
    <p class="intro">Send an email using our automated system.</p>

    <form id="emailForm">
        <input type="email" id="email" placeholder="Recipient email address" required>
        <textarea id="message" placeholder="Write your message..." required></textarea>
        <button class="btn btn-primary" type="submit" id="sendButton">Send email</button>
    </form>

    <p class="feedback" id="result" role="status" aria-live="polite"></p>
</main>

<!-- Developer tools: independent of the app layout -->
<button class="dev-toggle" id="devToggle" type="button"
        title="Developer settings" aria-label="Developer settings">⚙</button>

<dialog class="dev-dialog" id="devDialog" aria-labelledby="devTitle">
    <h2 id="devTitle">Developer settings</h2>

    <label for="apiUrl">FastAPI public tunnel URL</label>
    <div class="url-row">
        <input type="url" id="apiUrl" placeholder="https://your-tunnel.example.com"
               autocomplete="off" spellcheck="false">
        <button class="btn btn-secondary" type="button" id="pasteUrl">Paste</button>
    </div>

    <button class="btn btn-primary" type="button" id="saveUrl">Save URL</button>
    <button class="btn btn-secondary" type="button" id="resetUrl">Clear URL</button>
    <button class="btn btn-secondary" type="button" id="closeDev">Close</button>

    <p class="dev-status" id="apiStatus" role="status" aria-live="polite"></p>
</dialog>

<div>
  <h3>FastAPI Connection Test</h3>

  <input id="testEmail" type="email" placeholder="Your email">
  <br><br>

  <textarea id="testMessage" placeholder="Your test message"></textarea>
  <br><br>

  <button id="testButton">Send to FastAPI</button>

  <pre id="testResult"></pre>
</div>

<script>
(function () {
    "use strict";

    // ---------- Config ----------
    const STORAGE_KEY = "FASTAPI_URL";

    // ---------- Storage helpers (safe if storage is blocked) ----------
    function readStoredUrl() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }
    function writeStoredUrl(url) {
        try { localStorage.setItem(STORAGE_KEY, url); return true; } catch (e) { return false; }
    }
    function clearStoredUrl() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }

    function getApiUrl() {
        return (readStoredUrl() || "").replace(/\/+$/, "");
    }

    // ---------- Developer settings ----------
    const devDialog = document.getElementById("devDialog");
    const apiInput = document.getElementById("apiUrl");
    const apiStatus = document.getElementById("apiStatus");

    function setDevStatus(text, state) {
        apiStatus.textContent = text;
        apiStatus.dataset.state = state || "";
    }

    function showCurrentApi() {
        apiInput.value = getApiUrl();
        setDevStatus(getApiUrl() ? "Current API: " + getApiUrl() : "No API URL set. Paste one and save.");
    }

    function isValidTunnelUrl(value) {
        try {
            const u = new URL(value);
            return u.protocol === "https:" && !u.username && !u.password &&
                   !u.search && !u.hash && u.pathname === "/";
        } catch (e) {
            return false;
        }
    }

    document.getElementById("devToggle").addEventListener("click", function () {
        showCurrentApi();
        devDialog.showModal();
    });

    document.getElementById("closeDev").addEventListener("click", function () {
        devDialog.close();
    });

    // Close when clicking the backdrop
    devDialog.addEventListener("click", function (event) {
        if (event.target === devDialog) devDialog.close();
    });

    document.getElementById("saveUrl").addEventListener("click", function () {
        const url = apiInput.value.trim().replace(/\/+$/, "");
        if (!isValidTunnelUrl(url + "/")) {
            setDevStatus("Enter a valid HTTPS URL with no path, e.g. https://your-tunnel.example.com", "error");
            return;
        }
        if (!writeStoredUrl(url)) {
            setDevStatus("Could not save: browser storage is blocked.", "error");
            return;
        }
        setDevStatus("Saved. Current API: " + getApiUrl(), "ok");
    });

    document.getElementById("resetUrl").addEventListener("click", function () {
        clearStoredUrl();
        apiInput.value = "";
        setDevStatus("URL cleared. Paste a new one and save.", "ok");
    });

    document.getElementById("pasteUrl").addEventListener("click", async function () {
        try {
            const text = (await navigator.clipboard.readText()).trim();
            if (!text) {
                setDevStatus("Clipboard is empty.", "error");
                return;
            }
            apiInput.value = text;
            setDevStatus("Pasted. Select Save URL to use it.");
        } catch (e) {
            apiInput.focus();
            setDevStatus("Clipboard access was blocked. Paste manually with Ctrl+V.", "error");
        }
    });

    // ---------- Email form ----------
    const form = document.getElementById("emailForm");
    const result = document.getElementById("result");
    const sendButton = document.getElementById("sendButton");

    function setResult(text, state) {
        result.textContent = text;
        result.dataset.state = state || "";
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const payload = {
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        };

        const apiUrl = getApiUrl();
        if (!apiUrl) {
            setResult("No API URL set. Open developer settings (⚙) and paste one.", "error");
            return;
        }

        sendButton.disabled = true;
        setResult("Sending request...");

        try {
            const response = await fetch(apiUrl + "/n8n/email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // The server may return non-JSON (proxy or tunnel error pages)
            let data = {};
            try { data = await response.json(); } catch (e) {}

            if (!response.ok) {
                throw new Error(data.detail || "Request failed (" + response.status + ")");
            }

            setResult("Success! Request forwarded to n8n.", "ok");
            form.reset();
        } catch (error) {
            setResult("Error: " + error.message, "error");
            console.error(error);
        } finally {
            sendButton.disabled = false;
        }
    });
})();
ocument.getElementById("testButton").addEventListener("click", async () => {
  const result = document.getElementById("testResult");

  // Use the same saved API URL as your existing application
  const apiUrl = localStorage.getItem("FASTAPI_URL")?.replace(/\/+$/, "");

  if (!apiUrl) {
    result.textContent = "Please configure your FastAPI URL first.";
    return;
  }

  const payload = {
    email: document.getElementById("testEmail").value,
    message: document.getElementById("testMessage").value
  };

  try {
    const response = await fetch(apiUrl + "/test/receive", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();
    result.textContent = JSON.stringify(data, null, 2);

  } catch (error) {
    result.textContent = "Connection error: " + error.message;
  }
});
</script>

</body>
</html>
