<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Automation System</title>

<style>
:root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --border: #d1d5db;
    --border-soft: #e2e8f0;
    --text: #1f2937;
    --text-muted: #6b7280;
    --text-label: #334155;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --ok: #15803d;
    --error: #b91c1c;
}

* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ---------- Main app (the only thing in the page flow) ---------- */

.app {
    background: var(--surface);
    padding: 30px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
}

.app h1 {
    font-size: 1.5rem;
    text-align: center;
    margin: 0 0 8px;
}

.app .intro {
    text-align: center;
    color: var(--text-muted);
    margin: 0 0 12px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 15px;
}

textarea { height: 130px; resize: vertical; }

:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--border-soft); color: var(--text-label); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; }

.feedback {
    min-height: 1.25em;
    margin: 15px 0 0;
    font-size: 14px;
    text-align: center;
    color: var(--text-muted);
}
.feedback[data-state="ok"] { color: var(--ok); }
.feedback[data-state="error"] { color: var(--error); }

</style>
</head>

<body>

<!-- Main application -->
<main class="app">
    <h1>Email Automation</h1>
    <p class="intro">Send an email using the form.</p>

    <form id="emailForm">
        <input type="email" id="email" placeholder="Enter email address" required>
        <textarea id="message" placeholder="Write your message..." required></textarea>
        <button class="btn btn-primary" type="submit" id="sendButton">Send email</button>
    </form>

    <p class="feedback" id="result" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
    "use strict";

    const API_URL = "https://api-jfbf.onrender.com";

    const form = document.getElementById("emailForm");
    const result = document.getElementById("result");
    const sendButton = document.getElementById("sendButton");

    function setResult(text, state) {
        result.textContent = text;
        result.dataset.state = state || "";
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const payload = {
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        };

        sendButton.disabled = true;
        setResult("Sending request...");

        try {
            const response = await fetch(API_URL + "/n8n/email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            // The server may return non-JSON (proxy or platform error pages)
            let data = {};
            try { data = await response.json(); } catch (e) {}

            if (!response.ok) {
                throw new Error(data.detail || "Request failed (" + response.status + ")");
            }

            setResult("Success! Request forwarded to n8n.", "ok");
            form.reset();
        } catch (error) {
            setResult("Error: " + error.message, "error");
            console.error(error);
        } finally {
            sendButton.disabled = false;
        }
    });
})();
</script>

</body>
</html>
